<!DOCTYPE html>
<html>
<head>
<title>Camera Stream</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
}
#video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;  /* Thay đổi từ 'cover' sang 'contain' */
}
#captureBtn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    padding: 18px 32px;
    font-size: 22px;
    font-weight: bold;
    background: #ff5722;
    color: white;
    border: none;
    border-radius: 14px;
    box-shadow: 0px 0px 18px rgba(255, 87, 34, 0.6);
    cursor: pointer;
    transition: all 0.3s;
}
#captureBtn:hover {
    background: #e64a19;
    transform: scale(1.05);
}
#captureBtn:disabled {
    background: #999;
    cursor: not-allowed;
    transform: scale(1);
}
#resultBox {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 20px;
    border-radius: 12px;
    display: none;
    max-width: 400px;
    max-height: 80vh;
    overflow-y: auto;
    font-size: 14px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    z-index: 200;
}
#closeResult {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #ff5722;
    border: none;
    color: white;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}
#closeResult:hover {
    background: #e64a19;
}
.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<!-- Full screen stream -->
<img id="video" src="/video_feed">

<!-- Capture button -->
<button id="captureBtn">📸 Capture</button>

<!-- Result box -->
<div id="resultBox">
    <button id="closeResult">✕</button>
    <div id="resultContent"></div>
</div>

<script>
const captureBtn = document.getElementById("captureBtn");
const resultBox = document.getElementById("resultBox");
const resultContent = document.getElementById("resultContent");
const closeResult = document.getElementById("closeResult");

captureBtn.addEventListener("click", function () {
    captureBtn.disabled = true;
    captureBtn.innerHTML = '<span class="loading"></span> Processing...';
    
    fetch("/capture", { method: "POST" })
        .then(res => {
            if (!res.ok) {
                return res.json().then(err => Promise.reject(err));
            }
            return res.json();
        })
        .then(data => {
            captureBtn.disabled = false;
            captureBtn.innerHTML = "📸 Capture";
            
            if (data.success) {
                // Hiển thị kết quả từ backend
                resultContent.innerHTML = `
                    <h3 style="margin-top:0; padding-right:30px">✅ Processing Complete</h3>
                    <pre style="background:#222; padding:10px; border-radius:5px; overflow:auto; max-height:400px; font-size:12px">${JSON.stringify(data.result, null, 2)}</pre>
                `;
                resultBox.style.display = "block";
            } else {
                alert("Error: " + (data.error || "Unknown error"));
            }
        })
        .catch(err => {
            captureBtn.disabled = false;
            captureBtn.innerHTML = "📸 Capture";
            alert("Error: " + (err.error || err.message || "Connection failed"));
        });
});

closeResult.addEventListener("click", function() {
    resultBox.style.display = "none";
});
</script>
</body>
</html>
