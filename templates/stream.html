<!DOCTYPE html>
<html>
<head>
    <title>Camera Stream</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }
        #video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        #captureBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            font-size: 20px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        #result {
            position: fixed;
            top: 20px;
            left: 20px;
            max-width: 300px;
            border: 3px solid white;
        }
    </style>
</head>
<body>

    <!-- Full screen stream -->
    <img id="video" src="/video_feed">

    <!-- Capture button -->
    <button id="captureBtn">Capture</button>

    <!-- Result image -->
    <img id="result" style="display:none">

    <script>
        document.getElementById("captureBtn").addEventListener("click", function () {
            let btn = this;
            btn.disabled = true;
            btn.innerText = "Processing...";

            fetch("/capture", {
                method: "POST"
            })
            .then(response => response.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const result = document.getElementById("result");
                result.src = url;
                result.style.display = "block";

                btn.disabled = false;
                btn.innerText = "Capture";
            })
            .catch(err => {
                alert("Error capturing image!");
                btn.disabled = false;
                btn.innerText = "Capture";
            });
        });
    </script>

</body>
</html>
